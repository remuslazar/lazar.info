<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Remus Lazar</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #eef1f5; --fg: #1f2328; --dim: #59636e; --green: #1a7f37; --cyan: #0969da; color-scheme: light; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.6 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; padding: 10vh 16px; max-width: 820px; margin: 0 auto; overflow-wrap: anywhere; }
  .ps1 { color: var(--green); } .ps1 b { color: var(--cyan); font-weight: normal; }
  .dim { color: var(--dim); } a { color: var(--cyan); }
</style>
</head>
<body>
<div><span class="ps1">remus@lazar.info:<b>~</b>$</span> cd <span id="p">this-page</span></div>
<div>bash: cd: <span id="q">this-page</span>: No such file or directory</div>
<div class="dim">exit status 404</div>
<br>
<div><span class="ps1">remus@lazar.info:<b>~</b>$</span> <a href="/">cd ~</a></div>
<script>
  var p = location.pathname.replace(/^\//, '') || '/';
  document.getElementById('p').textContent = p;
  document.getElementById('q').textContent = p;
</script>
</body>
</html>
